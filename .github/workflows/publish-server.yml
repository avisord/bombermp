name: Publish Server Image to Docker Hub

# Fires on:
#   - git tag push matching `v*` (e.g. `v1.0.2`) → publishes versioned + latest tags
#   - manual run via the Actions UI            → publishes `:edge` only
#
# Required repo secrets:
#   DOCKERHUB_USERNAME — your Docker Hub username
#   DOCKERHUB_TOKEN    — Docker Hub access token (Read & Write scope)
#
# Optional repo variable:
#   DOCKERHUB_IMAGE    — override the image name (defaults to "<username>/bombermp-server")

on:
  push:
    tags: ['v*']
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/publish-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          NAME="${{ vars.DOCKERHUB_IMAGE }}"
          if [ -z "$NAME" ]; then
            NAME="${{ secrets.DOCKERHUB_USERNAME }}/bombermp-server"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Compute tags. For a tag push like `v1.2.3` we publish:
      #   :1.2.3, :1.2, :1, :latest
      # For a manual dispatch we publish:
      #   :edge
      - name: Generate Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
